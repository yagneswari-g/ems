spring.application.name=employee-management-system
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:yagni}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads}
app.max-file-size-mb=10

# Optional SMTP settings; mail errors are logged and do not break CRUD operations.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Gemini is called only by Spring Boot. Never expose this as a VITE_ variable.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:}
#gemini.model=gemini-3.6-flash
